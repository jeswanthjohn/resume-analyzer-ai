<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>AI Resume Analyzer</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <h1>AI Resume Analyzer</h1>

        <input type="file" id="resumeInput" accept=".pdf" />
        <button id="analyzeBtn">Analyze Resume</button>

        <div id="status"></div>

        <!-- Analysis mode indicator  -->
        <p id="analysis-mode" style="font-size: 0.85rem; opacity: 0.8;"></p>

        <pre id="result"></pre>
    </div>
</body>

<script src="/app.js"></script>

</html>
